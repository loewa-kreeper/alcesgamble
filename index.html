<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gamblers</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="brand-mark">Gamblers</p>
          <h1 class="brand-title">Roulette Room</h1>
        </div>
        <div class="auth-panel" id="auth-panel">
          <form class="auth-form" id="auth-form">
            <label>
              <span>Username</span>
              <input id="auth-username" type="text" autocomplete="username" placeholder="Player name" maxlength="20">
            </label>
            <label>
              <span>Password</span>
              <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password">
            </label>
            <div class="auth-actions">
              <button id="login-btn" class="action-button" type="submit">Log in</button>
              <button id="signup-btn" class="action-button accent" type="button">Sign up</button>
            </div>
          </form>
          <div class="account-card hidden" id="account-card">
            <p class="wallet-label">Signed in</p>
            <strong id="account-name">Account</strong>
            <span class="account-visibility" id="account-visibility">Public profile</span>
            <button id="settings-btn" class="action-button" type="button">Settings</button>
            <button id="logout-btn" class="action-button" type="button">Log out</button>
          </div>
          <p class="auth-message" id="auth-message">Wallet saves after you log in.</p>
        </div>
        <div class="wallet-panel">
          <div>
            <p class="wallet-label">Wallet</p>
            <p class="wallet-value" id="wallet-balance">$0.00</p>
          </div>
          <div class="level-panel">
            <div>
              <p class="wallet-label">Level</p>
              <p class="level-value" id="player-level">1</p>
            </div>
            <p class="rank-value" id="player-rank">Bronze</p>
            <div class="xp-meter" aria-label="XP progress">
              <div class="xp-fill" id="xp-fill"></div>
            </div>
            <p class="xp-text" id="player-xp">0 / 100 XP</p>
          </div>
        </div>
      </header>

      <main id="app-view" class="app-view"></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="game.js"></script>
  </body>
</html>
